{% extends "base.html" %}
{% load django_tables2 %}
{% block content %}
  <h2>Tags</h2>
  <p>Create tag</p>
  <form method="POST">
    {% csrf_token %}
    {% load widget_tweaks %}
    {% for field in form %}
      <div class="form-group">
          {{ field.errors }}
          {{ field.label_tag }}
          {{ field|add_class:"form-control" }}
      </div>
    {% endfor %}
    <button type="submit" class="btn btn-primary">Submit</button>
  </form>
{% endblock content %}
