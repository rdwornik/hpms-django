{% for form in formset.forms %}

{% for field in form %}
    {% for error in field.errors %}
        <div class="alert alert-primary mb-2 mr-2" role="alert">
            <strong>{{ field.name}}{{ error|escape }}</strong>
        </div>
    {% endfor %}
{% endfor %}
{% for error in form.non_field_errors %}
    <div class="alert alert-primary mb-2 mr-2" role="alert">
        <strong>{{ error|escape }}</strong>
    </div>
{% endfor %}
{% endfor %}
