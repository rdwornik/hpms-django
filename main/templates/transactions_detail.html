{% extends "base.html" %}
{% load django_tables2 %}
{% block content %}
  <h2>Transaction {{ transaction }}
    <a class="btn btn-info btn-sm mb-1" href="{% url 'all_notes_add' visitor_ip transaction%}">Add note</a>
  </h2>
  
  <div class="result">
    {% render_table table "tables/table.html"  %}
  </div>
{% endblock content %}
{% block js %}
<script>
  $('#select_per_page').val({{ request.GET.per_page }});
</script>
{% endblock js %}
